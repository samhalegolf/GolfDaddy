# Pretty URLs for the review-facing pages. Store review forms and humans both
# type these without the extension; a 404 at /privacy while privacy.html works
# is the kind of thing a reviewer notices and a rejection cites.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 301

[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 301

[[redirects]]
  from = "/welcome"
  to = "/welcome.html"
  status = 301

# The landing's original "Create account" target. The app has no separate
# signup page - the auth panel handles both - so this lands on the app shell
# with the landing redirect suppressed. 302 in case a real page appears later.
[[redirects]]
  from = "/signup"
  to = "/?login=1"
  status = 302

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# The browser studio (admin/tuning surface). Same deploy, same /api functions,
# same auth origin as the app at /; it just loads the studio-only panels the
# phone build strips. Never cache its shell - the app index is uncached for the
# same reason, and a stale studio index would load hashed asset URLs that no
# longer exist.
[[headers]]
  for = "/studio/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Apple requires the association file to be served as application/json, and it
# is the one file here with no extension - so nothing infers the type for it and
# the default would be octet-stream. iOS rejects a wrong content type by simply
# not verifying the domain, with no error surfaced anywhere, which is the same
# silent-failure shape the assetlinks.json comment in AndroidManifest describes.
# Cached short: changing which paths open the app should not wait on a CDN TTL.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"
