[build]
  publish = "dist"
  command = "npm run build:netlify"
  functions = "functions"

# The practice parser and the bubble Signal engine are each one file shared by
# the browser and a function, so they live in scripts/ where index.html can
# load them. That puts them outside the functions directory: pin them
# explicitly rather than trusting the bundler to trace a require that leaves
# functions/.
[functions]
  included_files = [
    "scripts/gd-practice-parser-core.js",
    "scripts/gd-bubble-signals-core.js"
  ]

# Local dev with the /api/* functions actually running. `python3 -m http.server`
# alone serves the source tree but no functions, so /api/auth-public-config 404s
# — and with no LINZ key the live map falls all the way through to OSM instead
# of aerial. `netlify dev` proxies the same static tree AND runs the functions,
# so a linked site's env (LINZ_BASEMAPS_PUBLIC_KEY) reaches the browser and the
# live map comes up as satellite, the way it does in production.
#   npx netlify link   # once, to pull the site's env
#   npx netlify dev    # then browse http://localhost:8888/app/index.html
# publish "." because the app source lives at /app/, not in the dist build.
[dev]
  command = "python3 -m http.server 5173"
  targetPort = 5173
  port = 8888
  publish = "."
  framework = "#custom"
  autoLaunch = false

# The single Booking <-> Caddy integration seam. Authenticated by a signed-in
# coach/admin token or the shared service secret (CLARITY_SERVICE_SECRET).
[[redirects]]
  from = "/api/clarity-integration"
  to = "/.netlify/functions/clarity-integration"
  status = 200

