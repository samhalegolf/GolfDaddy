<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clarity Caddy</title>
<link rel="stylesheet" href="../assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="route-home">

<section id="homeScreen" class="screen">
  <h1>Clarity Caddy</h1>
  <button id="playTile" type="button">Play</button>
  <p id="accountState"></p>
  <button id="accountAction" type="button" class="linkButton"></button>
</section>

<section id="signInScreen" class="screen">
  <form id="signInForm" class="signInCard">
    <h2>Sign in</h2>
    <input id="signInEmail" type="email" autocomplete="email" placeholder="Email" required>
    <input id="signInPassword" type="password" autocomplete="current-password" placeholder="Password" required>
    <button id="signInSubmit" type="submit">Sign in</button>
    <button id="signInBack" type="button" class="linkButton">Back</button>
    <p id="signInStatus"></p>
  </form>
</section>

<section id="pickerScreen" class="screen">
  <header class="pickerHeader">
    <button id="pickerBack" type="button">Home</button>
    <h2>Choose a course</h2>
  </header>
  <ul id="courseList"></ul>
  <p id="pickerEmpty" class="hiddenState">No courses available. Check your connection and pull to retry.</p>
</section>

<section id="playScreen" class="screen">
  <div id="map"></div>
  <div id="surfaceViewport">
    <img id="surfaceImage" alt="">
    <div id="gpsDot" class="hiddenState"></div>
  </div>
  <div class="playChrome">
    <button id="backHome" type="button">Home</button>
    <div><button id="prevHole" type="button">&#8249;</button>
      <span id="holeNumber">1</span>
      <button id="nextHole" type="button">&#8250;</button></div>
  </div>
  <button id="surfaceSource" type="button" class="hiddenState"></button>
  <pre id="surfaceMetaPanel" class="hiddenState"></pre>
  <div id="distanceBar" class="hiddenState">
    <div class="dist"><span class="distLabel">F</span><span id="distFront">–</span></div>
    <div class="dist distMain"><span class="distLabel">C</span><span id="distCentre">–</span></div>
    <div class="dist"><span class="distLabel">B</span><span id="distBack">–</span></div>
  </div>
</section>

<script src="../assets/vendor/leaflet/leaflet.js"></script>
<script src="js/platform.js"></script>
<script src="../scripts/clarity-supabase-auth.js"></script>
<script src="js/account.js"></script>
<script src="js/course-key.js"></script>
<script src="js/course-library.js"></script>
<script src="js/course-package.js"></script>
<script src="js/basemap.js"></script>
<script src="js/play-surface.js"></script>
<script src="js/distance.js"></script>
<script src="js/position.js"></script>
<script src="js/gps.js"></script>
<script src="js/play.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
