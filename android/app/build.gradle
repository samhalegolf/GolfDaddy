apply plugin: 'com.android.application'

/* Release signing.
 *
 * Credentials are read from keystore.properties or the environment, never from
 * this file: the keystore and its passwords must not enter the repository. Both
 * are gitignored.
 *
 * Losing the upload keystore means losing the ability to update the app on Play
 * unless Play App Signing key upgrade is used, so back it up somewhere durable
 * and separate from this machine.
 *
 * A release build without credentials fails loudly rather than silently falling
 * back to the debug key - a debug-signed artifact is rejected by Play, and
 * discovering that at upload time wastes a build.
 */
/* Version numbering.
 *
 * Play requires versionCode to strictly increase on every upload and silently
 * rejects a repeat, so leaving it hardcoded means remembering to bump it by hand
 * before each release - exactly the kind of step that gets forgotten once and
 * then wastes a build.
 *
 * Derived from the git commit count: monotonic under normal workflow, identical
 * for anyone building the same commit, and needs no state file to keep in sync.
 * A floor guards the case where git is unavailable (building from an archive,
 * or a shallow clone) so a build can never emit a LOWER code than one already
 * uploaded - which would be rejected and is hard to diagnose.
 *
 * ANDROID_VERSION_CODE overrides everything, for CI that numbers its own builds.
 */
def VERSION_CODE_FLOOR = 1

def resolveVersionCode = { ->
    def override = System.getenv("ANDROID_VERSION_CODE")
    if (override != null && override.trim() ==~ /\d+/) {
        return Math.max(VERSION_CODE_FLOOR, override.trim().toInteger())
    }
    try {
        def out = new ByteArrayOutputStream()
        def err = new ByteArrayOutputStream()
        def result = exec {
            commandLine "git", "rev-list", "--count", "HEAD"
            workingDir rootProject.projectDir
            standardOutput = out
            errorOutput = err
            ignoreExitValue = true
        }
        def counted = out.toString().trim()
        if (result.exitValue == 0 && counted ==~ /\d+/ && counted.toInteger() > 0) {
            return Math.max(VERSION_CODE_FLOOR, counted.toInteger())
        }
    } catch (Exception ignored) {
        // git unavailable - fall through to the floor
    }
    return VERSION_CODE_FLOOR
}

/* Human-readable version, taken from package.json so the app, the web build and
   the repo cannot drift apart. */
def resolveVersionName = { ->
    try {
        def pkg = new File(rootProject.projectDir.parentFile, "package.json")
        if (pkg.exists()) {
            def parsed = new groovy.json.JsonSlurper().parseText(pkg.text)
            if (parsed?.version) return parsed.version.toString()
        }
    } catch (Exception ignored) {
        // fall through
    }
    return "1.0"
}

def appVersionCode = resolveVersionCode()
def appVersionName = resolveVersionName()

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingValue = { String propertyKey, String envKey ->
    def fromFile = keystoreProperties.getProperty(propertyKey)
    if (fromFile != null && !fromFile.trim().isEmpty()) return fromFile.trim()
    def fromEnv = System.getenv(envKey)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    return null
}

def releaseStorePath = signingValue("storeFile", "ANDROID_KEYSTORE_FILE")
def releaseStorePassword = signingValue("storePassword", "ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "ANDROID_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseStorePath != null && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null

android {
    namespace = "com.claritygolf.caddy"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.claritygolf.caddy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                /* Both schemes: v1 for older devices, v2 for the modern
                   whole-APK signature Play expects. */
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

/* Fail the build rather than emit an unsigned or debug-signed release. Play
   rejects those, and finding out at upload time means the build was wasted.
   Checked at task-graph time so it fails before any work is done. */
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i).*(assemble|bundle)Release.*/
    }
    if (buildingRelease) {
        /* Printed so the number that goes to Play is visible in the build log
           rather than something to go digging for after an upload is rejected. */
        logger.lifecycle("Clarity Caddy release: versionCode ${appVersionCode}, versionName ${appVersionName}")
    }
    if (buildingRelease && !hasReleaseSigning) {
        throw new GradleException(
            "Release signing is not configured.\n" +
            "Create android/keystore.properties (see keystore.properties.example) " +
            "or set ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS " +
            "and ANDROID_KEY_PASSWORD.\n" +
            "Neither the keystore nor its passwords belong in the repository."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
