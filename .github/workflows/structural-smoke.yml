name: Structural smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [structural-rebuild]

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Boot real page
        run: npm run test:boot

      - name: Run structural regression tests
        run: |
          node dev/surface-split.test.js
          node dev/icon-assets.test.js
          node dev/image-assets.test.js
          node dev/visual-engine-client.test.js
          node dev/app-permissions-smoke.test.js
          node dev/native-shell-owner.test.js
          node dev/store-billing.test.js
          node dev/referral-reward-entitlements.test.js
          node dev/store-billing-client.test.js
          node dev/native-back-button.test.js
          node dev/course-key-normalisation.test.js
          node dev/course-identity-resolution.test.js
          node dev/captured-scan-hydrate.test.js
          node dev/auth-route-boot-release.test.js
          node dev/scan-push-filter.test.js
          node dev/password-reset-surface.test.js
          node dev/course-hole-count.test.js
          node dev/placeholder-profile-identity.test.js
          node dev/course-library-manifest.test.js
          node dev/course-library-client.test.js
          node dev/course-picker-meta-label.test.js
          node dev/error-reporting.test.js
          node dev/durable-storage.test.js
          node dev/deep-links.test.js
          node dev/account-restore.test.js
          node dev/store-referral-reversal.test.js
          node dev/email-public-url.test.js
          node dev/auth-refresh-resilience.test.js
          node dev/cloud-sync-honesty.test.js
          node dev/deploy-cache-busting.test.js
          node dev/course-publish-merge.test.js
          node dev/shell-owner.test.js
          node dev/shell-behavior.test.js
          node dev/course-location-owner.test.js
          node dev/course-location-behavior.test.js
          node dev/course-picker-location.test.js
          node dev/course-picker-owner.test.js
          node dev/course-picker-behavior.test.js
          node dev/gps-location-lifecycle-behavior.test.js
          node dev/gps-location-lifecycle-owner.test.js
          node dev/gps-scorecard-owner.test.js
          node dev/gps-scorecard-behavior.test.js
          node dev/green-shape-engine-owner.test.js
          node dev/green-shape-engine-behavior.test.js
          node dev/automapper-green-refinement-owner.test.js
          node dev/automapper-green-refinement-behavior.test.js
          node dev/gps-play-camera-tilt.test.js
