name: Structural smoke

on:
  pull_request:
    branches: [main]
  # main is here because it was not: the suite ran on PRs only, so anything pushed or merged
  # straight to main was never verified again. A stale assertion sat red on main for at least
  # four commits and surfaced as a failure on the next unrelated PR to open.
  push:
    branches: [main, structural-rebuild]

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Boot real page
        run: npm run test:boot

      - name: Run structural regression tests
        run: |
          node dev/surface-split.test.js
          node dev/studio-wiring.test.js
          node dev/icon-assets.test.js
          node dev/image-assets.test.js
          node dev/visual-engine-client.test.js
          node dev/ios-version-stamp.test.js
          node dev/app-permissions-smoke.test.js
          node dev/native-shell-owner.test.js
          node dev/store-billing.test.js
          node dev/referral-reward-entitlements.test.js
          node dev/store-billing-client.test.js
          node dev/native-back-button.test.js
          node dev/fresh-app-boot.test.js
          node dev/app-native-contract.test.js
          node dev/app-course-data-feed.test.js
          node dev/course-identity-resolution.test.js
          node dev/auth-route-boot-release.test.js
          node dev/password-reset-surface.test.js
          node dev/course-hole-count.test.js
          node dev/placeholder-profile-identity.test.js
          node dev/course-library-manifest.test.js
          node dev/course-library-client.test.js
          node dev/course-picker-meta-label.test.js
          node dev/error-reporting.test.js
          node dev/durable-storage.test.js
          node dev/deep-links.test.js
          node dev/account-restore.test.js
          node dev/auth-update-account.test.js
          node dev/account-delete.test.js
          node dev/account-clear-data.test.js
          node dev/profile-hydrate.test.js
          node dev/payment-access-failsafe.test.js
          node dev/auth-config-cache.test.js
          node dev/session-change-diagnostics.test.js
          node dev/payment-admin-auth.test.js
          node dev/referrals-auth.test.js
          node dev/referral-invite-target.test.js
          node dev/payment-checkout-client.test.js
          node dev/payment-entitlement-auth.test.js
          node dev/store-referral-reversal.test.js
          node dev/email-public-url.test.js
          node dev/auth-refresh-resilience.test.js
          node dev/cloud-sync-honesty.test.js
          node dev/deploy-cache-busting.test.js
          node dev/course-publish-merge.test.js
          node dev/shell-owner.test.js
          node dev/shell-behavior.test.js
          node dev/course-location-owner.test.js
          node dev/course-location-behavior.test.js
          node dev/course-picker-location.test.js
          node dev/course-picker-owner.test.js
          node dev/course-picker-behavior.test.js
          node dev/green-shape-engine-owner.test.js
          node dev/green-shape-engine-behavior.test.js
          node dev/conditions-engine.test.js
          node dev/course-data-intake.test.js
          node dev/course-data-comparison.test.js
          node dev/conditions-engine-ownership.test.js
          node dev/conditions-engine-behavior.test.js
          node dev/course-mapping-controller.test.js
          node dev/course-visual-engine.test.js
          node dev/course-mapper-jobs.test.js
          node dev/course-mapper-worker.test.js
          node dev/course-mapper-worker-integration.test.js
          node dev/automapper-core.test.js
          node dev/geometry-resolver-core.test.js
          node dev/green-shape-core-smoke.test.js
          node dev/course-package.test.js
          node dev/course-package-trigger.test.js
          node dev/imagery-source-registry.test.js
          node dev/map-source-coverage.test.js
          node dev/shell-navigation-owner.test.js
          node dev/payment-rollout-tests.js

      # Practice data ingestion. These suites existed and passed but nothing ran
      # them, so a parser change could land unnoticed - which is exactly the
      # thing the CSV pipeline cannot afford.
      - name: Practice data suites
        run: npm run test:practice
